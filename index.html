<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080f">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<title>Onda</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#07080f;--indigo:#4b3df2;--coral:#ff5d8f;--aqua:#3fe0d0;--tx:#f5f6ff;--mut:rgba(245,246,255,.62)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--tx);font-family:Figtree,system-ui,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}
[hidden]{display:none!important}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.blobs{position:fixed;inset:0;overflow:hidden;z-index:0}
.blobs i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 28s ease-in-out infinite alternate;will-change:transform}
.blobs i:nth-child(1){background:var(--indigo);left:-25vmax;top:-20vmax}
.blobs i:nth-child(2){background:var(--coral);right:-30vmax;top:25vh;animation-delay:-9s;opacity:.4}
.blobs i:nth-child(3){background:var(--aqua);left:-10vmax;bottom:-35vmax;animation-delay:-17s;opacity:.35}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
@keyframes pulse{50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){.blobs i,.sk{animation:none}.sheet{transition:none!important}}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.05));-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.06),0 12px 32px rgba(0,0,0,.35)}
main{position:relative;z-index:1;height:100%;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 18px) 18px 190px;-webkit-overflow-scrolling:touch}
.view{display:none;max-width:640px;margin:0 auto}.view.on{display:block}
h1{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:6px 0 16px}
h2{font-size:18px;font-weight:600;margin:22px 2px 8px}
.search{display:flex;align-items:center;gap:10px;padding:0 16px;height:52px;border-radius:26px}
.search input{flex:1;background:none;border:0;color:var(--tx);font:inherit;font-size:16px;min-width:0}
.search input::placeholder{color:var(--mut)}
.note{margin:12px 2px;color:var(--mut);font-size:14px;line-height:1.45}.note:empty{display:none}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px -18px 0;padding:0 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 16px;border-radius:20px;font-size:14px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);white-space:nowrap}
.chip.on{background:linear-gradient(135deg,var(--aqua),var(--indigo));border-color:transparent;color:#04050c}
.hero{display:block;width:100%;margin-top:16px;padding:20px;border-radius:26px;text-align:left;position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(255,93,143,.55),rgba(75,61,242,.5));border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 14px 34px rgba(0,0,0,.35)}
.hero b{display:block;font-size:22px;font-weight:800;letter-spacing:-.01em}.hero span{display:block;margin-top:4px;font-size:14px;color:rgba(255,255,255,.8)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{height:96px;border-radius:22px;padding:14px;text-align:left;display:flex;align-items:flex-end;font-weight:800;font-size:16px;background:var(--bg);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 26px rgba(0,0,0,.3)}
.cat.big{grid-column:1/-1;height:120px;font-size:21px}
.list{display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;gap:6px;border-radius:18px;padding:6px 8px}
.item:active{background:rgba(255,255,255,.1)}
.main{display:flex;flex:1;min-width:0;align-items:center;gap:12px;text-align:left;padding:0}
.art{width:54px;height:54px;border-radius:12px;background:linear-gradient(135deg,var(--indigo),var(--coral)) center/cover;flex:none}
.meta{flex:1;min-width:0}
.meta b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{display:block;font-size:13px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.now .meta b{color:var(--aqua)}
.heart{padding:10px}.heart.on{color:var(--coral)}.heart.on svg{fill:var(--coral)}
.sk{height:66px;border-radius:18px;background:rgba(255,255,255,.08);margin-bottom:6px;animation:pulse 1.4s ease-in-out infinite}
.bar2{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.back{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.btn{height:44px;padding:0 20px;border-radius:22px;font-weight:600;background:linear-gradient(135deg,var(--aqua),var(--indigo));color:#04050c;display:inline-flex;align-items:center;gap:8px}
.btn svg{width:18px;height:18px;fill:currentColor;stroke:none}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--tx);border:1px solid rgba(255,255,255,.15)}
.stats{display:flex;gap:12px;margin-bottom:6px}
.stat{flex:1;padding:16px;border-radius:22px}.stat b{display:block;font-size:28px;font-weight:800}.stat span{font-size:13px;color:var(--mut)}
#mini{position:fixed;z-index:5;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 80px);height:64px;border-radius:32px;display:none;align-items:center;gap:12px;padding:0 14px 0 8px;overflow:hidden;max-width:616px;margin:0 auto}
#mini.on{display:flex}
#mini .art{width:48px;height:48px;border-radius:50%}
#mini .bar{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--aqua),var(--coral));width:0}
.tabs{position:fixed;z-index:6;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);height:62px;border-radius:31px;display:flex;justify-content:space-around;align-items:center;max-width:616px;margin:0 auto;padding:0 4px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mut);padding:6px 11px;border-radius:20px}
.tabs button.on{color:var(--tx);background:rgba(255,255,255,.14)}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(8,9,22,.62);-webkit-backdrop-filter:blur(44px) saturate(180%);backdrop-filter:blur(44px) saturate(180%);transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1);padding:calc(env(safe-area-inset-top) + 12px) 24px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;align-items:center;overflow-y:auto;visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet>*{width:100%;max-width:400px}
.sheet .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
#bigart{aspect-ratio:1;border-radius:28px;background:linear-gradient(135deg,var(--indigo),var(--coral)) center/cover;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.titles{display:flex;align-items:center;gap:12px;margin:26px 0 14px}
.titles .meta b{font-size:21px;font-weight:800}.titles .meta span{font-size:15px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:3px;background:rgba(255,255,255,.2);outline-offset:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(63,224,208,.3)}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin:8px 0 14px}
.ctl{display:flex;justify-content:center;align-items:center;gap:26px}
.ctl svg{width:30px;height:30px}
#shuf{opacity:.5}#shuf.on{opacity:1;color:var(--aqua)}
.play{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--aqua),var(--indigo));color:#04050c;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 14px 34px rgba(75,61,242,.5)}
.play svg{width:34px;height:34px;fill:currentColor;stroke:none}
</style></head><body>
<div class="blobs"><i></i><i></i><i></i></div>
<main>
<section id="home" class="view on">
 <h1>Onda</h1>
 <div class="glass search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Canciones, artistas o álbumes" enterkeyhint="search" autocomplete="off"></div>
 <button class="hero" id="hero"><b>Música cristiana evangélica</b><span>Alabanza, adoración, gospel y más</span></button>
 <h2 id="ttl">Tendencias</h2>
 <div id="msg" class="note"></div>
 <div id="l-home" class="list"></div>
</section>
<section id="cats" class="view">
 <div id="cgrid"><h1>Categorías</h1><div class="grid" id="grid"></div></div>
 <div id="cdet" hidden>
  <div class="bar2"><button class="back glass" id="cback" aria-label="Volver"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><h1 id="ctitle" style="margin:0;font-size:26px"></h1></div>
  <div class="chips" id="csubs"></div>
  <div style="margin:14px 0 6px"><button class="btn" id="cplay"><svg viewBox="0 0 24 24"><path d="M7 4.500v15a1 1 0 0 0 1.500.9l12-7.500a1 1 0 0 0 0-1.700l-12-7.500A1 1 0 0 0 7 4.500z"/></svg>Reproducir</button></div>
  <div id="cmsg" class="note"></div><div id="l-cat" class="list"></div>
 </div>
</section>
<section id="favs" class="view"><h1>Favoritas</h1>
 <div style="margin-bottom:10px"><button class="btn" id="fplay"><svg viewBox="0 0 24 24"><path d="M7 4.500v15a1 1 0 0 0 1.500.9l12-7.500a1 1 0 0 0 0-1.700l-12-7.500A1 1 0 0 0 7 4.500z"/></svg>Reproducir todo</button></div>
 <div id="l-favs" class="list"></div></section>
<section id="lib" class="view"><h1>Biblioteca</h1>
 <div class="stats"><div class="glass stat"><b id="nf">0</b><span>Favoritas</span></div><div class="glass stat"><b id="nr">0</b><span>Escuchadas</span></div></div>
 <h2>Recientes</h2>
 <div style="margin-bottom:6px"><button class="btn ghost" id="clr">Borrar historial</button></div>
 <div id="l-lib" class="list"></div></section>
</main>

<div id="mini" class="glass"><button id="open" class="main" aria-label="Abrir reproductor"><div class="art" id="mart"></div><div class="meta"><b id="mt"></b><span id="ma"></span></div></button>
 <button id="mplay" aria-label="Reproducir o pausar"></button><div class="bar" id="mbar"></div></div>

<nav class="glass tabs">
 <button class="on" data-t="home"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
 <button data-t="cats"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Categorías</button>
 <button data-t="favs"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.300-8-11a4.500 4.500 0 0 1 8-2.800A4.500 4.500 0 0 1 20 10c0 5.700-8 11-8 11z"/></svg>Favoritas</button>
 <button data-t="lib"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Biblioteca</button>
</nav>

<div class="sheet" id="sheet" aria-hidden="true">
 <div class="top"><button id="close" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button><span style="width:24px"></span></div>
 <div id="bigart"></div>
 <div class="titles"><div class="meta"><b id="st"></b><span id="sa"></span></div><button class="heart" id="sheart" aria-label="Me gusta"></button></div>
 <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Progreso">
 <div class="times"><span id="t0">0:00</span><span id="t1">0:00</span></div>
 <div class="ctl"><button id="shuf" aria-label="Aleatorio"><svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button><button id="prev" aria-label="Anterior"></button><button class="play" id="bplay" aria-label="Reproducir o pausar"></button><button id="next" aria-label="Siguiente"></button><span style="width:30px"></span></div>
</div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I={play:'<svg viewBox="0 0 24 24"><path d="M7 4.500v15a1 1 0 0 0 1.500.9l12-7.500a1 1 0 0 0 0-1.700l-12-7.500A1 1 0 0 0 7 4.500z"/></svg>',
pause:'<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4.500" height="16" rx="1.500"/><rect x="13.500" y="4" width="4.500" height="16" rx="1.500"/></svg>',
next:'<svg viewBox="0 0 24 24"><path d="m5 4 10 8-10 8z" fill="currentColor"/><path d="M19 5v14"/></svg>',
prev:'<svg viewBox="0 0 24 24"><path d="M19 4 9 12l10 8z" fill="currentColor"/><path d="M5 5v14"/></svg>',
heart:'<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.300-8-11a4.500 4.500 0 0 1 8-2.800A4.500 4.500 0 0 1 20 10c0 5.700-8 11-8 11z"/></svg>'};
$('#next').innerHTML=I.next;$('#prev').innerHTML=I.prev;$('#sheart').innerHTML=I.heart;

let favs=LS.get('onda_favs',[]).filter(t=>t.src!=='yt'),recents=LS.get('onda_recents',[]).filter(t=>t.src!=='yt'),queue=[],idx=-1,cur=null,shuf=false,hosts=[],host=null,retry=0;
const au=new Audio();au.preload='auto';const pre=new Audio();pre.preload='auto';pre.muted=true;

/* Categorías */
const CATS=[
{id:'cris',n:'Música cristiana evangélica',big:1,c:'linear-gradient(135deg,#ff5d8f,#4b3df2)',subs:[
 ['Alabanza y adoración','alabanza adoración'],['Cristiana en español','música cristiana'],['Worship','worship'],['Gospel','gospel'],['Rap cristiano','rap cristiano'],['Himnos','himnos'],['Piano e instrumental','piano worship'],['Devocional',0,'Devotional']]},
{id:'pop',n:'Pop',c:'linear-gradient(135deg,#ff8a5c,#ff5d8f)',subs:[['Pop',0,'Pop']]},
{id:'lat',n:'Latina',c:'linear-gradient(135deg,#f7b733,#fc4a1a)',subs:[['Latina',0,'Latin']]},
{id:'hip',n:'Hip-Hop y Rap',c:'linear-gradient(135deg,#6a11cb,#2575fc)',subs:[['Hip-Hop y Rap',0,'Hip-Hop/Rap']]},
{id:'ele',n:'Electrónica',c:'linear-gradient(135deg,#3fe0d0,#4b3df2)',subs:[['Electrónica',0,'Electronic']]},
{id:'roc',n:'Rock',c:'linear-gradient(135deg,#434343,#c0392b)',subs:[['Rock',0,'Rock']]},
{id:'rnb',n:'R&B y Soul',c:'linear-gradient(135deg,#8e2de2,#ff5d8f)',subs:[['R&B y Soul',0,'R&B/Soul']]},
{id:'lofi',n:'Lo-Fi',c:'linear-gradient(135deg,#355c7d,#c06c84)',subs:[['Lo-Fi',0,'Lo-Fi']]},
{id:'aco',n:'Acústica y Folk',c:'linear-gradient(135deg,#56ab2f,#3fe0d0)',subs:[['Acústica',0,'Acoustic'],['Folk',0,'Folk']]},
{id:'jaz',n:'Jazz y Clásica',c:'linear-gradient(135deg,#0f2027,#4b3df2)',subs:[['Jazz',0,'Jazz'],['Clásica',0,'Classical']]},
{id:'amb',n:'Ambiental',c:'linear-gradient(135deg,#2193b0,#6dd5ed)',subs:[['Ambiental',0,'Ambient']]}];
$('#grid').innerHTML=CATS.map(c=>`<button class="cat${c.big?' big':''}" data-c="${c.id}" style="--bg:${c.c}">${esc(c.n)}</button>`).join('');

/* API de Audius */
const mapT=t=>({id:t.id,title:t.title,artist:t.user?.name||'',art:t.artwork?.['480x480']||t.artwork?.['150x150']||'',dur:t.duration});
async function getHost(){if(host)return host;if(!hosts.length){try{hosts=(await(await fetch('https://api.audius.co')).json()).data||[]}catch{}}if(!hosts.length)hosts=['https://discoveryprovider.audius.co'];host=hosts[Math.random()*hosts.length|0];return host}
async function api(p){for(let k=0;k<3;k++){try{const h=await getHost();const r=await fetch(h+p+(p.includes('?')?'&':'?')+'app_name=onda');if(!r.ok)throw 0;return((await r.json()).data||[]).filter(t=>t.is_streamable!==false).map(mapT)}catch{host=null}}throw Error('net')}
const cache=new Map();
async function get(kind,a,g){const k=kind+'|'+a+'|'+g;if(cache.has(k))return cache.get(k);
 const p=kind==='s'?`/v1/tracks/search?query=${encodeURIComponent(a)}&limit=30`:`/v1/tracks/trending?time=week&limit=30${g?'&genre='+encodeURIComponent(g):''}`;
 const d=await api(p);cache.set(k,d);return d}

/* Listas */
const SK='<div class="sk"></div>'.repeat(6);
const isFav=t=>!!t&&favs.some(f=>f.id===t.id);
function render(el,t){el._tracks=t;el.innerHTML=t.map((x,i)=>`<div class="item"><button class="main" data-i="${i}"><div class="art" style="background-image:url('${esc(x.art)}')"></div><div class="meta"><b>${esc(x.title)}</b><span>${esc(x.artist)}</span></div></button><button class="heart${isFav(x)?' on':''}" data-h="${i}" aria-label="Me gusta">${I.heart}</button></div>`).join('');mark()}
async function fill(el,msg,fn){const n=el._n=(el._n||0)+1;el._tracks=[];el.innerHTML=SK;msg.textContent='';
 try{const t=await fn();if(n!==el._n)return;render(el,t);if(!t.length)msg.textContent='Sin resultados. Prueba con otras palabras.'}
 catch{if(n!==el._n)return;el.innerHTML='';msg.textContent='No se pudo conectar. Revisa tu conexión e inténtalo de nuevo.'}}
function mark(){$$('.list').forEach(L=>(L._tracks||[]).forEach((t,i)=>{const r=L.children[i];if(r)r.classList.toggle('now',!!cur&&cur.id===t.id)}))}
function syncHearts(){$$('.list').forEach(L=>L.querySelectorAll('[data-h]').forEach(b=>b.classList.toggle('on',isFav(L._tracks[+b.dataset.h]))));$('#sheart').classList.toggle('on',isFav(cur))}
function renderFavs(){const L=$('#l-favs');if(!favs.length){L._tracks=[];L.innerHTML='<p class="note">Aún no tienes favoritas. Toca el corazón en cualquier canción para guardarla aquí.</p>'}else render(L,favs);$('#nf').textContent=favs.length}
function renderLib(){const L=$('#l-lib');if(!recents.length){L._tracks=[];L.innerHTML='<p class="note">Todavía no has escuchado nada. Busca una canción o explora las categorías.</p>'}else render(L,recents);$('#nr').textContent=recents.length;$('#nf').textContent=favs.length}
function toggleFav(t){if(!t)return;favs=isFav(t)?favs.filter(f=>f.id!==t.id):[t,...favs];LS.set('onda_favs',favs);$('#nf').textContent=favs.length;if($('#favs').classList.contains('on'))renderFavs();syncHearts()}
document.addEventListener('click',e=>{const m=e.target.closest('[data-i]'),h=e.target.closest('[data-h]');const L=(m||h)?.closest('.list');if(!L)return;
 if(m)play(L._tracks,+m.dataset.i);if(h)toggleFav(L._tracks[+h.dataset.h])});

/* Navegación */
function tab(t){$$('.view').forEach(v=>v.classList.toggle('on',v.id===t));$$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));if(t==='favs')renderFavs();if(t==='lib')renderLib();$('main').scrollTop=0}
$$('.tabs button').forEach(b=>b.onclick=()=>{if(b.dataset.t==='cats')closeCat();tab(b.dataset.t)});
let cat=null;
function openCat(id){cat=CATS.find(c=>c.id===id);$('#cgrid').hidden=true;$('#cdet').hidden=false;$('#ctitle').textContent=cat.n;
 $('#csubs').innerHTML=cat.subs.length>1?cat.subs.map((s,i)=>`<button class="chip" data-s="${i}">${esc(s[0])}</button>`).join(''):'';subCat(0);$('main').scrollTop=0}
function subCat(i){const s=cat.subs[i];$$('#csubs .chip').forEach((c,j)=>c.classList.toggle('on',j===i));
 fill($('#l-cat'),$('#cmsg'),()=>s[1]?get('s',s[1]):get('t','',s[2]))}
function closeCat(){$('#cgrid').hidden=false;$('#cdet').hidden=true}
$('#grid').onclick=e=>{const b=e.target.closest('[data-c]');if(b)openCat(b.dataset.c)};
$('#csubs').onclick=e=>{const b=e.target.closest('[data-s]');if(b)subCat(+b.dataset.s)};
$('#cback').onclick=closeCat;
$('#hero').onclick=()=>{tab('cats');openCat('cris')};
$('#cplay').onclick=()=>{const t=$('#l-cat')._tracks;if(t&&t.length)play(t,0)};
$('#fplay').onclick=()=>{if(favs.length)play(favs,0)};
$('#clr').onclick=()=>{recents=[];LS.set('onda_recents',recents);renderLib()};
$('#open').onclick=()=>{$('#sheet').classList.add('on');$('#sheet').setAttribute('aria-hidden','false')};
$('#close').onclick=()=>{$('#sheet').classList.remove('on');$('#sheet').setAttribute('aria-hidden','true')};

/* Búsqueda en vivo */
let tmr;
function doSearch(q){$('#ttl').textContent=q?'Resultados':'Tendencias';fill($('#l-home'),$('#msg'),()=>q?get('s',q):get('t','',''))}
$('#q').addEventListener('input',e=>{clearTimeout(tmr);tmr=setTimeout(()=>doSearch(e.target.value.trim()),350)});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(tmr);e.target.blur();doSearch(e.target.value.trim())}});

/* Reproducción */
const url=async t=>`${await getHost()}/v1/tracks/${t.id}/stream?app_name=onda`;
async function play(L,i){queue=L;idx=i;retry=0;await load()}
async function load(){cur=queue[idx];if(!cur)return;ui();
 try{au.src=await url(cur);await au.play()}catch{}
 recents=[cur,...recents.filter(r=>r.id!==cur.id)].slice(0,40);LS.set('onda_recents',recents);
 const n=queue[(idx+1)%queue.length];if(n&&n.id!==cur.id)try{pre.src=await url(n)}catch{}}
au.onerror=async()=>{if(!cur)return;if(retry++<2){host=null;await load()}else{retry=0;step(1)}};
function step(d){if(!queue.length)return;idx=shuf&&d>0&&queue.length>1?(idx+1+Math.random()*(queue.length-1)|0)%queue.length:(idx+d+queue.length)%queue.length;retry=0;load()}
function toggle(){if(!cur)return;au.paused?au.play().catch(()=>{}):au.pause()}
function setPlay(p){$('#bplay').innerHTML=p?I.pause:I.play;$('#mplay').innerHTML=p?I.pause:I.play;if('mediaSession'in navigator)navigator.mediaSession.playbackState=p?'playing':'paused'}
au.onplay=()=>setPlay(true);au.onpause=()=>setPlay(false);au.onended=()=>step(1);
$('#bplay').onclick=$('#mplay').onclick=toggle;$('#next').onclick=()=>step(1);$('#prev').onclick=()=>{if(au.currentTime>3)au.currentTime=0;else step(-1)};
$('#sheart').onclick=()=>toggleFav(cur);
$('#shuf').onclick=()=>{shuf=!shuf;$('#shuf').classList.toggle('on',shuf)};
function ui(){$('#mini').classList.add('on');const bg=cur.art?`url('${cur.art}')`:'';$('#mart').style.backgroundImage=bg;$('#bigart').style.backgroundImage=bg;
 $('#mt').textContent=$('#st').textContent=cur.title;$('#ma').textContent=$('#sa').textContent=cur.artist;syncHearts();mark();
 if('mediaSession'in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:cur.title,artist:cur.artist,artwork:cur.art?[{src:cur.art}]:[]});
  navigator.mediaSession.setActionHandler('play',toggle);navigator.mediaSession.setActionHandler('pause',toggle);
  navigator.mediaSession.setActionHandler('nexttrack',()=>step(1));navigator.mediaSession.setActionHandler('previoustrack',()=>step(-1))}}
const fmt=s=>{s=Math.max(0,s|0);return(s/60|0)+':'+String(s%60).padStart(2,'0')};
let drag=false;const sk=$('#seek');
sk.oninput=()=>{drag=true;$('#t0').textContent=fmt(sk.value)};
sk.onchange=()=>{drag=false;au.currentTime=+sk.value};
setInterval(()=>{if(!cur)return;const t=au.currentTime,d=isFinite(au.duration)?au.duration:(cur.dur||0);if(!d)return;
 sk.max=d;$('#t1').textContent=fmt(d);$('#mbar').style.width=(t/d*100)+'%';if(!drag){sk.value=t;$('#t0').textContent=fmt(t)}},400);

setPlay(false);doSearch('');
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
